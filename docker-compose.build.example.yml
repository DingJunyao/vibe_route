# 统一部署：前后端 + nginx 同容器，一个端口访问完整应用。
#
# 用法：
#   1. cp docker-compose.example.yml docker-compose.yml   （docker-compose.yml 已 gitignore，可自定义）
#   2. cp backend/.env.example backend/.env   （并修改生产密钥 SECRET_KEY 等）
#   3. docker compose up
#
# 端口：默认宿主 80，自定义时设置环境变量 APP_PORT，如 APP_PORT=8080 docker compose up
# 挂载点（均可省略，但生产建议保留以持久化）：
#   - backend/.env  → env_file 注入后端配置（持久化在宿主文件）
#   - ./backend/data → SQLite 库 + 上传/导出文件（省略则容器内 ephemeral，重启丢库）
#   - ./backend/logs → 运行日志

services:
  app:
    build:
      context: .
      target: all-in-one
    image: vibe-route:all-in-one
    container_name: vibe-route
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      # 动画导出等场景后端（playwright）打开前端页面的地址：同容器 nginx
      FRONTEND_URL: http://127.0.0.1
    env_file:
      - backend/.env          # 不存在则 compose 报错：先 cp backend/.env.example backend/.env
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    restart: unless-stopped
