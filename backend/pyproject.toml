# 后端依赖声明。与 requirements.txt 保持等价：新增依赖时两边同步修改，
# 保证 `pip install -r requirements.txt`、`pip install .`、`uv sync` 结果一致。
[project]
name = "vibe-route-backend"
version = "0.1.0"
description = "Vibe Route - 全栈 Web 轨迹管理系统后端"
requires-python = ">=3.11"
dependencies = [
    # FastAPI 和服务器
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "slowapi",
    # 数据库
    "sqlalchemy",
    "alembic",
    # 数据库驱动 (支持多数据库)
    "aiosqlite",
    "asyncmy",        # x86 平台推荐（高性能），ARM 需 Rust 编译
    "aiomysql",       # ARM 平台备用（纯 Python）
    "asyncpg",        # PostgreSQL 异步驱动，ARM 需 Rust 编译
    # Alembic 同步驱动 (用于数据库迁移)
    "pymysql",
    "psycopg2-binary", # PostgreSQL 同步驱动，ARM 需编译
    # 认证
    "bcrypt==4.0.1",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-dotenv",
    # 任务队列
    "celery",
    "redis",
    # 验证
    "pydantic",
    "pydantic-settings",
    "email-validator",
    # HTTP 客户端
    "httpx",
    "aiofiles",
    "requests",
    # gpxutil 核心依赖
    "gpxpy",
    "lxml",
    "pandas",
    "geopandas",
    "shapely",
    # SVG 生成
    "svgwrite",
    "svgpathtools @ https://github.com/bcwhite-code/svgpathtools/archive/refs/heads/master.zip",
    "fonttools",
    # 图像处理
    "pillow",
    "cairosvg",
    "imageio",
    "numpy",
    # 其他工具
    "tqdm",
    "pyyaml",
    "pypinyin",
    "loguru",
    "openpyxl",
    # 测试
    "pytest",
    "pytest-asyncio",
    # 解压
    "rarfile",
    "playwright==1.58.0",
]

[tool.uv]
# 后端是以 uvicorn 直接运行的应用，不是可安装的包：uv 只管理依赖，不构建项目本身
package = false
